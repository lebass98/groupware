<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fluid Attendant - 로그인</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container": "#e4e7ff",
            "on-primary-container": "#001e58",
            "tertiary-container": "#feb700",
            "on-surface": "#232c51",
            "surface": "#f7f5ff",
            "secondary-dim": "#005c37",
            "on-surface-variant": "#515981",
            "surface-container-highest": "#d5dbff",
            "on-background": "#232c51",
            "surface-dim": "#cad2ff",
            "inverse-on-surface": "#929bc6",
            "error": "#b31b25",
            "on-primary-fixed-variant": "#00276c",
            "on-secondary-container": "#005c37",
            "primary": "#0052d0",
            "on-primary-fixed": "#000000",
            "primary-fixed": "#799dff",
            "surface-bright": "#f7f5ff",
            "error-container": "#fb5151",
            "surface-container-high": "#dde1ff",
            "surface-container-low": "#efefff",
            "on-tertiary": "#fff1de",
            "inverse-surface": "#020a2f",
            "on-primary": "#f1f2ff",
            "on-tertiary-container": "#533a00",
            "error-dim": "#9f0519",
            "secondary-container": "#61fbab",
            "tertiary-fixed": "#feb700",
            "primary-dim": "#0047b7",
            "tertiary-fixed-dim": "#ecaa00",
            "surface-tint": "#0052d0",
            "on-secondary": "#caffdb",
            "on-secondary-fixed": "#004729",
            "surface-variant": "#d5dbff",
            "on-tertiary-fixed-variant": "#5f4200",
            "background": "#f7f5ff",
            "primary-container": "#799dff",
            "secondary-fixed": "#61fbab",
            "inverse-primary": "#5e8bff",
            "surface-container-lowest": "#ffffff",
            "secondary-fixed-dim": "#4fec9e",
            "tertiary-dim": "#694a00",
            "tertiary": "#785500",
            "on-error-container": "#570008",
            "outline": "#6c759e",
            "outline-variant": "#a2abd7",
            "primary-fixed-dim": "#638eff",
            "on-tertiary-fixed": "#392700",
            "secondary": "#00693f",
            "on-secondary-fixed-variant": "#00673e",
            "on-error": "#ffefee"
          },
          fontFamily: {
            "headline": ["Pretendard", "sans-serif"],
            "body": ["Pretendard", "sans-serif"],
            "label": ["Pretendard", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      min-height: 100dvh;
      font-family: 'Pretendard', sans-serif;
    }
    /* Toast Styling */
    .toast-container {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }
    .toast {
      background: #232c51;
      color: #ffffff;
      padding: 0.85rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 10px 25px rgba(35, 44, 81, 0.2);
      animation: slideDown 0.3s ease forwards;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface flex flex-col items-center justify-center min-h-screen px-6 py-12 relative overflow-x-hidden">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Content Wrapper for Centralization -->
  <div class="w-full max-w-md flex flex-col items-center z-10">

    <!-- Top Navigation / Logo Centered -->
    <header class="w-full mb-12 flex flex-col items-center justify-center gap-3">
      <div class="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-on-primary shadow-lg shadow-primary/25">
        <span class="material-symbols-outlined text-3xl" data-icon="fingerprint">fingerprint</span>
      </div>
      <h1 class="font-headline font-bold text-3xl tracking-tight text-primary">Fluid Attendant</h1>
    </header>

    <!-- Welcome Section Centered -->
    <div class="w-full text-center mb-10">
      <h2 class="font-headline font-extrabold text-4xl text-on-surface mb-2 tracking-tight">반가워요!</h2>
      <p class="text-on-surface-variant font-medium">오늘도 즐거운 하루 되세요.</p>
    </div>

    <!-- Login Form Container (White Card) -->
    <div class="w-full bg-surface-container-lowest rounded-lg p-8 shadow-[0_20px_50px_rgba(35,44,81,0.08)]">
      <form class="space-y-6" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
        <!-- Email Field -->
        <div class="space-y-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-2">이메일 주소</label>
          <div class="relative group">
            <input id="email-input" class="w-full bg-surface-container-highest border-none rounded-md px-5 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" placeholder="name@company.com" type="email" value="name@company.com" required />
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <div class="flex justify-between items-center px-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant">비밀번호</label>
            <a class="text-xs font-bold text-primary hover:opacity-80 transition-opacity" href="#" onclick="event.preventDefault(); showToast('🔒 비밀번호 재설정 이메일이 발송되었습니다.');">비밀번호 찾기</a>
          </div>
          <div class="relative group">
            <input id="password-input" class="w-full bg-surface-container-highest border-none rounded-md px-5 py-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all" placeholder="••••••••" type="password" value="••••••••" required />
          </div>
        </div>

        <!-- Primary Login Action -->
        <div class="pt-2">
          <button type="submit" class="w-full py-4 px-6 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-lg rounded-full shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            로그인
            <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
          </button>
        </div>
      </form>

      <!-- Divider -->
      <div class="relative my-10 flex items-center">
        <div class="flex-grow border-t border-outline-variant/20"></div>
        <span class="flex-shrink mx-4 text-xs font-bold text-outline uppercase tracking-widest">또는 다음으로 로그인</span>
        <div class="flex-grow border-t border-outline-variant/20"></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <!-- Google -->
        <button type="button" onclick="handleSocialLogin('Google')" class="flex items-center justify-center gap-3 py-4 rounded-xl border border-outline-variant/15 bg-surface-container-lowest hover:bg-surface-container-low transition-colors group">
          <div class="w-6 h-6 flex items-center justify-center">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          </div>
          <span class="text-sm font-bold text-on-surface">Google</span>
        </button>

        <!-- Naver -->
        <button type="button" onclick="handleSocialLogin('Naver')" class="flex items-center justify-center gap-3 py-4 rounded-xl bg-[#03C75A] hover:opacity-90 transition-opacity group">
          <div class="w-6 h-6 flex items-center justify-center bg-white rounded-sm overflow-hidden p-0.5">
            <div class="text-[#03C75A] font-extrabold text-sm leading-none">N</div>
          </div>
          <span class="text-sm font-bold text-white">Naver</span>
        </button>
      </div>
    </div>

    <!-- Signup Anchor Centered -->
    <div class="mt-8 text-center">
      <p class="text-on-surface-variant font-medium">
        처음이신가요? 
        <a class="text-primary font-bold ml-1 hover:underline underline-offset-4" href="#" onclick="event.preventDefault(); showToast('🎉 회원가입 페이지로 이동합니다.');">계정 만들기</a>
      </p>
    </div>
  </div>

  <!-- Background Decorative Elements -->
  <div class="fixed -bottom-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed top-1/4 -left-12 w-48 h-48 bg-secondary-container/10 rounded-full blur-3xl pointer-events-none"></div>

  <script src="script.js"></script>
</body>
</html>
