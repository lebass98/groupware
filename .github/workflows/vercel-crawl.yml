name: Vercel 하루 두 번 근태일지 수집

on:
  schedule:
    # 한국 시간 매일 08:15, 18:15. GitHub 실행 시간은 지연될 수 있습니다.
    - cron: '15 23,9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-sitegate-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: 서울 Vercel 서버에서 수집하고 Firestore에 저장
        env:
          CRAWL_SECRET: ${{ secrets.WNC_CRAWL_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 330 \
            --request POST \
            --header "Authorization: Bearer $CRAWL_SECRET" \
            https://wnc-groupware.vercel.app/api/sync/cron
