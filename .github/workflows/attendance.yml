name: 출퇴근 등록 (sitegate)

# 앱의 출근/퇴근 버튼이 GitHub Pages(정적 호스팅)에서도 실제 그룹웨어에 기록되게 하는 워크플로.
#
# 브라우저는 sitegate를 직접 호출할 수 없다(HTTP 전용 + CORS 없음 + 자격증명 노출).
# 그래서 앱이 이 워크플로를 실행시키고, 러너가 대신 로그인해 출퇴근을 등록한다.
#
# 주의: 실제 근태 기록을 남긴다. 잘못 등록하면 sitegate에서 직접 수정해야 한다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '출근(in) 또는 퇴근(out)'
        required: true
        type: choice
        options:
          - in
          - out

permissions:
  contents: write

# 출근과 퇴근이 동시에 돌지 않게 한다.
concurrency:
  group: sitegate-attendance
  cancel-in-progress: false

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Vercel API 및 Vercel Cron으로 전환되었습니다."
