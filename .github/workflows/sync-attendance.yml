name: 근태일지·휴가 자동 크롤링

# Mac 러너의 전체 업무 데이터 수집은 수동 실행용으로 유지합니다.
# 근태일지 하루 두 번 정기 수집은 vercel-crawl.yml이 서울 Vercel API를 호출합니다.

on:
  workflow_dispatch:
    inputs:
      year:
        description: '크롤링할 연도 (비우면 지난달~다음달 자동 범위)'
        required: false
        type: string
      month:
        description: '크롤링할 월 1~12 (연도와 함께 입력해야 단일 월 모드로 동작)'
        required: false
        type: string

# 커밋을 밀어 넣어야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 스케줄과 수동 실행이 겹쳐 같은 파일을 동시에 고치지 않도록 한 번에 하나만 돈다.
concurrency:
  group: sync-attendance
  cancel-in-progress: false

jobs:
  sync:
    # sitegate는 해외(클라우드) IP 접속을 막아 GitHub 호스티드 러너에서는 크롤링이 항상 실패한다.
    # 그래서 국내 IP인 사내 Mac에 등록한 셀프호스티드 러너에서 실행한다.
    runs-on: [self-hosted, macOS, sitegate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci

      - name: 근태일지 크롤링 및 동기화
        env:
          SITEGATE_URL: ${{ secrets.SITEGATE_URL }}
          SITEGATE_ID: ${{ secrets.SITEGATE_ID }}
          SITEGATE_PW: ${{ secrets.SITEGATE_PW }}
        run: |
          if [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.month }}" ]; then
            echo "단일 월 모드: ${{ inputs.year }}년 ${{ inputs.month }}월"
            node scripts/sync-daily-reports.js --year=${{ inputs.year }} --month=${{ inputs.month }}
          else
            echo "기본 범위 모드: 지난달 ~ 다음달"
            node scripts/sync-daily-reports.js
          fi

      - name: 휴가 관리 크롤링 및 동기화
        env:
          SITEGATE_URL: ${{ secrets.SITEGATE_URL }}
          SITEGATE_ID: ${{ secrets.SITEGATE_ID }}
          SITEGATE_PW: ${{ secrets.SITEGATE_PW }}
        run: node scripts/sync-leaves.js

      - name: 비품/자산 대장 크롤링 및 동기화
        env:
          SITEGATE_URL: ${{ secrets.SITEGATE_URL }}
          SITEGATE_ID: ${{ secrets.SITEGATE_ID }}
          SITEGATE_PW: ${{ secrets.SITEGATE_PW }}
        run: node scripts/sync-equipment.js

      - name: 경비지출내역 크롤링 및 동기화
        env:
          SITEGATE_URL: ${{ secrets.SITEGATE_URL }}
          SITEGATE_ID: ${{ secrets.SITEGATE_ID }}
          SITEGATE_PW: ${{ secrets.SITEGATE_PW }}
        run: node scripts/sync-expenses.js

      - name: 업무지원 요청/이슈 크롤링 및 동기화
        env:
          SITEGATE_URL: ${{ secrets.SITEGATE_URL }}
          SITEGATE_ID: ${{ secrets.SITEGATE_ID }}
          SITEGATE_PW: ${{ secrets.SITEGATE_PW }}
        run: node scripts/sync-issues.js

      - name: 디바이스 간 데이터 일치 검증
        run: node data/verify-consistency.js

      - name: 변경사항 커밋 및 푸시
        run: |
          # macOS에서 유입될 수 있는 AppleDouble 메타데이터 파일은 항상 제거한다.
          find . -name "._*" -not -path "./node_modules/*" -delete || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "변경사항이 없어 커밋을 건너뜁니다."
            exit 0
          fi

          git commit -m "자동: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 근태일지 크롤링 동기화"
          # 동시에 다른 커밋이 올라왔을 수 있으므로 리베이스 후 푸시한다.
          git pull --rebase origin main
          git push origin HEAD:main
